packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true

# Endurecimiento de la cadena de suministro (reglas de Semgrep).
# minimumReleaseAge en minutos: 1 día por ahora; subir a 10080 (7 días) cuando el lockfile madure.
blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
